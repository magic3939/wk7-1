<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Adventure!</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Comic Sans MS", "Trebuchet MS", Arial, sans-serif;
  background: linear-gradient(180deg, #dff4ff 0%, #fff8d8 100%);
  color: #263238;
  min-height: 100vh;
}

header {
  text-align: center;
  padding: 28px 15px 18px;
}

header h1 {
  margin: 0;
  font-size: 42px;
  color: #3155a6;
  letter-spacing: 1px;
}

header p {
  font-size: 18px;
  margin-top: 8px;
}

.progress-wrap {
  width: 90%;
  max-width: 800px;
  margin: 0 auto 20px;
  background: white;
  border-radius: 30px;
  padding: 7px;
  box-shadow: 0 4px 12px rgba(0,0,0,.12);
}

.progress-bar {
  height: 18px;
  width: 0%;
  background: linear-gradient(90deg, #65c7f7, #7b75ff);
  border-radius: 20px;
  transition: width .4s;
}

.tabs {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 22px;
}

.tabs button {
  border: none;
  padding: 12px 22px;
  border-radius: 25px;
  font-family: "Comic Sans MS", "Trebuchet MS", Arial, sans-serif;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  background: white;
  color: #3155a6;
  box-shadow: 0 3px 8px rgba(0,0,0,.13);
}

.tabs button.active {
  background: #3155a6;
  color: white;
}

section {
  display: none;
}

section.active {
  display: block;
}

/* =========================
   LEARN
========================= */

.word-grid {
  width: 94%;
  max-width: 1100px;
  margin: auto;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px,1fr));
  gap: 17px;
  padding-bottom: 40px;
}

.word-card {
  background: white;
  border-radius: 22px;
  padding: 17px;
  text-align: center;
  box-shadow: 0 6px 14px rgba(0,0,0,.12);
  cursor: pointer;
  transition: transform .2s;
  border: 4px solid transparent;
}

.word-card:hover {
  transform: translateY(-5px);
}

.word-card.learned {
  border-color: #5dc878;
}

.picture {
  height: 105px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 68px;
  background: #f4f8ff;
  border-radius: 18px;
  margin-bottom: 10px;
}

.word {
  font-size: 27px;
  font-weight: bold;
  color: #3155a6;
  margin: 6px 0;
}

.meaning {
  font-family: "Trebuchet MS", Arial, sans-serif;
  font-size: 15px;
  color: #555;
  min-height: 38px;
}

.speak {
  border: none;
  background: #ffdf68;
  border-radius: 20px;
  padding: 7px 12px;
  cursor: pointer;
  font-family: "Comic Sans MS", "Trebuchet MS", Arial, sans-serif;
  font-weight: bold;
  margin-top: 8px;
}

/* =========================
   FLASHCARDS
========================= */

.flash-area {
  text-align: center;
  padding: 10px 15px 50px;
}

.flashcard {
  max-width: 530px;
  min-height: 430px;
  margin: auto;
  background: white;
  border-radius: 30px;
  box-shadow: 0 8px 20px rgba(0,0,0,.15);
  padding: 25px;
}

.flash-image {
  font-size: 115px;
  height: 150px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.flash-word {
  font-size: 45px;
  font-weight: bold;
  color: #3155a6;
}

.flash-meaning {
  font-family: "Trebuchet MS", Arial, sans-serif;
  font-size: 22px;
  margin-top: 12px;
}

.flash-example {
  margin: 20px auto;
  background: #f2f6ff;
  border-radius: 18px;
  padding: 15px;
  font-family: "Trebuchet MS", Arial, sans-serif;
  font-size: 18px;
  line-height: 1.5;
}

.controls {
  margin-top: 20px;
}

.controls button {
  border: none;
  padding: 12px 20px;
  margin: 5px;
  border-radius: 22px;
  font-family: "Comic Sans MS", "Trebuchet MS", Arial, sans-serif;
  font-size: 17px;
  cursor: pointer;
  font-weight: bold;
}

.prev {
  background: #ddd;
}

.listen {
  background: #ffdf68;
}

.know {
  background: #64d783;
}

.next {
  background: #6f87ff;
  color: white;
}

/* =========================
   QUIZ
========================= */

.quiz-box {
  width: 92%;
  max-width: 650px;
  margin: auto;
  background: white;
  border-radius: 30px;
  padding: 30px;
  text-align: center;
  box-shadow: 0 8px 20px rgba(0,0,0,.15);
}

.quiz-count {
  color: #777;
  font-weight: bold;
}

.quiz-image {
  font-size: 100px;
  margin: 15px;
}

.quiz-question {
  font-size: 27px;
  font-weight: bold;
  margin: 20px 0;
}

.answers {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.answer {
  border: 3px solid #dbe2ff;
  background: #f7f9ff;
  padding: 16px;
  border-radius: 17px;
  font-family: "Comic Sans MS", "Trebuchet MS", Arial, sans-serif;
  font-size: 20px;
  cursor: pointer;
  font-weight: bold;
}

.answer:hover {
  background: #e8edff;
}

.correct {
  background: #bff2c9 !important;
  border-color: #54bd69 !important;
}

.wrong {
  background: #ffcaca !important;
  border-color: #ef6969 !important;
}

.feedback {
  min-height: 45px;
  margin-top: 18px;
  font-size: 21px;
  font-weight: bold;
}

.score {
  font-size: 18px;
  color: #3155a6;
  font-weight: bold;
}

/* =========================
   MATCH GAME
========================= */

.match-instructions {
  text-align: center;
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 18px;
  color: #3155a6;
}

.match-grid {
  width: 94%;
  max-width: 850px;
  margin: auto;
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 14px;
  padding-bottom: 40px;
}

.match-card {
  min-height: 120px;
  background: white;
  border-radius: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 10px;
  cursor: pointer;
  box-shadow: 0 5px 12px rgba(0,0,0,.13);
  border: 4px solid transparent;
  transition: transform .18s, border-color .18s, background .18s;
  user-select: none;
}

/* WORD CARDS IN MATCH GAME */
.match-card.word-match {
  font-family: "Comic Sans MS", "Trebuchet MS", Arial, sans-serif;
  font-size: 29px;
  line-height: 1.2;
  font-weight: bold;
  color: #4056a1;
  letter-spacing: .4px;
}

/* PICTURE CARDS IN MATCH GAME */
.match-card.emoji {
  font-size: 55px;
  background: #fffdf4;
}

.match-card:hover {
  transform: scale(1.04);
}

.match-card.selected {
  border-color: #6f87ff;
  background: #eef1ff;
  transform: scale(1.04);
}

.match-card.matched {
  background: #c9f5d2;
  visibility: hidden;
}

.match-message {
  text-align: center;
  font-size: 23px;
  font-weight: bold;
  min-height: 45px;
  color: #4256a8;
}

/* =========================
   FOOTER
========================= */

footer {
  text-align: center;
  padding: 20px;
  color: #666;
  font-weight: bold;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px) {

  header h1 {
    font-size: 32px;
  }

  .answers {
    grid-template-columns: 1fr;
  }

  .match-grid {
    grid-template-columns: repeat(2,1fr);
  }

  .match-card.word-match {
    font-size: 26px;
  }

  .flash-word {
    font-size: 38px;
  }
}
</style>
</head>

<body>

<header>
  <h1>🌟 Word Adventure! 🌟</h1>
  <p>Learn 20 awesome English words!</p>
</header>

<div class="progress-wrap">
  <div class="progress-bar" id="progressBar"></div>
</div>

<div class="tabs">
  <button class="active" onclick="showSection('learn',this)">
    📚 Learn
  </button>

  <button onclick="showSection('flash',this)">
    🃏 Flashcards
  </button>

  <button onclick="showSection('quiz',this)">
    🎯 Quiz
  </button>

  <button onclick="showSection('match',this)">
    🧩 Match
  </button>
</div>

<!-- LEARN -->
<section id="learn" class="active">
  <div class="word-grid" id="wordGrid"></div>
</section>

<!-- FLASHCARDS -->
<section id="flash">
  <div class="flash-area">

    <div class="flashcard">

      <div class="flash-image" id="flashImage"></div>

      <div class="flash-word" id="flashWord"></div>

      <div class="flash-meaning" id="flashMeaning"></div>

      <div class="flash-example" id="flashExample"></div>

      <div class="controls">

        <button class="prev" onclick="previousWord()">
          ⬅ Back
        </button>

        <button class="listen" onclick="speakCurrent()">
          🔊 Listen
        </button>

        <button class="know" onclick="learnCurrent()">
          ⭐ I Know It!
        </button>

        <button class="next" onclick="nextWord()">
          Next ➡
        </button>

      </div>

    </div>

  </div>
</section>

<!-- QUIZ -->
<section id="quiz">

  <div class="quiz-box">

    <div class="quiz-count" id="quizCount"></div>

    <div class="quiz-image" id="quizImage"></div>

    <div class="quiz-question" id="quizQuestion"></div>

    <div class="answers" id="answers"></div>

    <div class="feedback" id="feedback"></div>

    <div class="score" id="score"></div>

  </div>

</section>

<!-- MATCH -->
<section id="match">

  <div class="match-instructions">
    🧩 Match the word with the picture!
  </div>

  <div class="match-message" id="matchMessage"></div>

  <div class="match-grid" id="matchGrid"></div>

</section>

<footer>
  ⭐ Look • Listen • Say • Remember ⭐
</footer>

<script>

/* ==================================================
   20 TARGET WORDS
   "stare" has been removed.
================================================== */

const words = [

  {
    word:"bold",
    emoji:"🦸",
    meaning:"brave and confident",
    example:"Mia was bold and spoke in front of the class."
  },

  {
    word:"coward",
    emoji:"😨",
    meaning:"a person who is not brave",
    example:"The coward was too scared to enter the dark cave."
  },

  {
    word:"empty",
    emoji:"📭",
    meaning:"having nothing inside",
    example:"The box is empty."
  },

  {
    word:"flee",
    emoji:"🏃💨",
    meaning:"to run away from danger",
    example:"The rabbits flee when they see the fox."
  },

  {
    word:"fortune",
    emoji:"💰",
    meaning:"a lot of money or good luck",
    example:"The pirate found a fortune in the treasure chest."
  },

  {
    word:"gasp",
    emoji:"😮",
    meaning:"to take a quick breath in surprise",
    example:"I gasped when I saw the huge spider."
  },

  {
    word:"grin",
    emoji:"😁",
    meaning:"to smile widely",
    example:"Ben had a big grin on his face."
  },

  {
    word:"sharp",
    emoji:"✏️",
    meaning:"having a thin edge or point",
    example:"Be careful! The pencil is sharp."
  },

  {
    word:"sneaky",
    emoji:"🥷",
    meaning:"doing things secretly",
    example:"The sneaky cat tried to steal the fish."
  },

  {
    word:"dart",
    emoji:"🐭💨",
    meaning:"to move very quickly",
    example:"The little mouse darted under the table."
  },

  {
    word:"fog",
    emoji:"🌫️",
    meaning:"a thick cloud close to the ground",
    example:"The road disappeared in the fog."
  },

  {
    word:"gulp",
    emoji:"🥤",
    meaning:"to swallow quickly",
    example:"Sam gulped down his water."
  },

  {
    word:"host",
    emoji:"🎉",
    meaning:"a person who welcomes guests",
    example:"Dad was the host of our party."
  },

  {
    word:"rude",
    emoji:"😒",
    meaning:"not polite",
    example:"It is rude to interrupt someone."
  },

  {
    word:"scold",
    emoji:"☝️😠",
    meaning:"to speak angrily because someone did something wrong",
    example:"Mom scolded Max for drawing on the wall."
  },

  {
    word:"serious",
    emoji:"😐",
    meaning:"not joking or playing",
    example:"The teacher had a serious look on her face."
  },

  {
    word:"sly",
    emoji:"🦊",
    meaning:"clever in a secret or tricky way",
    example:"The sly fox quietly followed the chickens."
  },

  {
    word:"upset",
    emoji:"😢",
    meaning:"sad, worried, or unhappy",
    example:"Ella was upset when she lost her toy."
  },

  {
    word:"weary",
    emoji:"🥱",
    meaning:"very tired",
    example:"The weary traveler wanted to sleep."
  },

  {
    word:"fortune",
    emoji:"🍀",
    meaning:"good luck",
    example:"Good fortune brought the family a happy surprise."
  }

];

/*
The requested vocabulary contains 20 learning items after removing "stare".
This version keeps 20 cards for the activity.
*/

let learned = new Set();
let current = 0;


/* ==================================================
   LEARN
================================================== */

function buildWordGrid() {

  const grid = document.getElementById("wordGrid");

  grid.innerHTML = "";

  words.forEach((item,index) => {

    const card = document.createElement("div");

    card.className = "word-card";

    if(learned.has(index)) {
      card.classList.add("learned");
    }

    card.innerHTML = `
      <div class="picture">${item.emoji}</div>

      <div class="word">
        ${item.word}
      </div>

      <div class="meaning">
        ${item.meaning}
      </div>

      <button class="speak">
        🔊 Hear it
      </button>
    `;

    card.onclick = () => {

      learned.add(index);

      updateProgress();

      buildWordGrid();

    };

    card.querySelector(".speak").onclick = (event) => {

      event.stopPropagation();

      speak(item.word);

    };

    grid.appendChild(card);

  });

}


/* ==================================================
   PROGRESS
================================================== */

function updateProgress() {

  const percent =
    (learned.size / words.length) * 100;

  document.getElementById("progressBar").style.width =
    percent + "%";

}


/* ==================================================
   SPEECH
================================================== */

function speak(text) {

  if(!("speechSynthesis" in window)) {
    return;
  }

  speechSynthesis.cancel();

  const utterance =
    new SpeechSynthesisUtterance(text);

  utterance.lang = "en-US";

  utterance.rate = 0.75;

  speechSynthesis.speak(utterance);

}


/* ==================================================
   TABS
================================================== */

function showSection(id,button) {

  document
    .querySelectorAll("section")
    .forEach(section => {

      section.classList.remove("active");

    });

  document
    .getElementById(id)
    .classList.add("active");


  document
    .querySelectorAll(".tabs button")
    .forEach(btn => {

      btn.classList.remove("active");

    });

  button.classList.add("active");


  if(id === "flash") {
    showFlash();
  }

  if(id === "quiz") {
    startQuiz();
  }

  if(id === "match") {
    startMatch();
  }

}


/* ==================================================
   FLASHCARDS
================================================== */

function showFlash() {

  const item = words[current];

  document.getElementById("flashImage").textContent =
    item.emoji;

  document.getElementById("flashWord").textContent =
    item.word;

  document.getElementById("flashMeaning").textContent =
    item.meaning;

  document.getElementById("flashExample").innerHTML =
    `💬 <strong>Example:</strong><br>${item.example}`;

}


function previousWord() {

  current--;

  if(current < 0) {
    current = words.length - 1;
  }

  showFlash();

}


function nextWord() {

  current++;

  if(current >= words.length) {
    current = 0;
  }

  showFlash();

}


function speakCurrent() {

  speak(words[current].word);

}


function learnCurrent() {

  learned.add(current);

  updateProgress();

  buildWordGrid();

  const button =
    document.querySelector(".know");

  const oldText =
    button.textContent;

  button.textContent =
    "🎉 Great job!";

  setTimeout(() => {

    button.textContent =
      oldText;

    nextWord();

  },700);

}


/* ==================================================
   QUIZ
================================================== */

let quizOrder = [];
let quizIndex = 0;
let quizScore = 0;
let answered = false;


function shuffle(array) {

  return [...array]
    .sort(() => Math.random() - 0.5);

}


function startQuiz() {

  quizOrder =
    shuffle(
      [...Array(words.length).keys()]
    );

  quizIndex = 0;

  quizScore = 0;

  answered = false;

  showQuizQuestion();

}


function showQuizQuestion() {

  if(quizIndex >= quizOrder.length) {

    document.getElementById("quizCount").textContent =
      "Quiz Complete!";

    document.getElementById("quizImage").textContent =
      "🏆";

    document.getElementById("quizQuestion").textContent =
      `You got ${quizScore} out of ${words.length}!`;

    document.getElementById("answers").innerHTML =
      `<button class="answer" onclick="startQuiz()">
        🔄 Play Again
      </button>`;

    document.getElementById("feedback").textContent =
      quizScore >= words.length * .8
      ? "Amazing work! 🌟"
      : "Great practice! Keep going! 💪";

    document.getElementById("score").textContent =
      "";

    return;

  }


  answered = false;


  const correctIndex =
    quizOrder[quizIndex];

  const correct =
    words[correctIndex];


  document.getElementById("quizCount").textContent =
    `Question ${quizIndex + 1} of ${words.length}`;


  document.getElementById("quizImage").textContent =
    correct.emoji;


  document.getElementById("quizQuestion").innerHTML =
    `Which word matches this picture?<br><br>❓`;


  document.getElementById("feedback").textContent =
    "";


  document.getElementById("score").textContent =
    `⭐ Score: ${quizScore}`;


  let wrongChoices =
    words
      .map((item,index) => ({
        item,
        index
      }))
      .filter(x =>
        x.index !== correctIndex &&
        x.item.word !== correct.word
      );


  wrongChoices =
    shuffle(wrongChoices).slice(0,3);


  let choices = [

    {
      item:correct,
      index:correctIndex
    },

    ...wrongChoices

  ];


  choices =
    shuffle(choices);


  const answers =
    document.getElementById("answers");


  answers.innerHTML =
    "";


  choices.forEach(choice => {

    const button =
      document.createElement("button");


    button.className =
      "answer";


    button.textContent =
      choice.item.word;


    button.onclick = () =>

      answerQuiz(
        button,
        choice.index,
        correctIndex
      );


    answers.appendChild(button);

  });

}


function answerQuiz(
  button,
  chosen,
  correct
) {

  if(answered) {
    return;
  }

  answered = true;


  const buttons =
    document.querySelectorAll(".answer");


  buttons.forEach(btn => {

    if(
      btn.textContent ===
      words[correct].word
    ) {

      btn.classList.add("correct");

    }

  });


  if(chosen === correct) {

    quizScore++;

    button.classList.add("correct");


    document.getElementById("feedback").textContent =
      "🎉 Correct! Great job!";


    speak(words[correct].word);


    learned.add(correct);

    updateProgress();

    buildWordGrid();

  }

  else {

    button.classList.add("wrong");


    document.getElementById("feedback").textContent =
      `💡 The answer is "${words[correct].word}".`;


    speak(words[correct].word);

  }


  document.getElementById("score").textContent =
    `⭐ Score: ${quizScore}`;


  setTimeout(() => {

    quizIndex++;

    showQuizQuestion();

  },1300);

}


/* ==================================================
   MATCH GAME
================================================== */

let firstMatch = null;

let lockMatch = false;

let matchedPairs = 0;


function startMatch() {

  firstMatch = null;

  lockMatch = false;

  matchedPairs = 0;


  document.getElementById("matchMessage").textContent =
    "Find the matching pairs! 🌟";


  /*
    8 words are selected for each round.
    This keeps the board easy to see
    and manageable for young learners.
  */

  const selectedIndices =

    shuffle(
      [...Array(words.length).keys()]
    ).slice(0,8);


  let cards = [];


  selectedIndices.forEach(index => {

    cards.push({

      id:index,

      type:"word",

      content:words[index].word

    });


    cards.push({

      id:index,

      type:"emoji",

      content:words[index].emoji

    });

  });


  cards =
    shuffle(cards);


  const grid =
    document.getElementById("matchGrid");


  grid.innerHTML =
    "";


  cards.forEach(cardData => {

    const card =
      document.createElement("div");


    if(cardData.type === "emoji") {

      card.className =
        "match-card emoji";

    }

    else {

      card.className =
        "match-card word-match";

    }


    card.textContent =
      cardData.content;


    card.dataset.id =
      cardData.id;


    card.dataset.type =
      cardData.type;


    card.onclick = () =>
      selectMatch(card);


    grid.appendChild(card);

  });

}


function selectMatch(card) {

  if(lockMatch) {
    return;
  }

  if(
    card.classList.contains("matched")
  ) {
    return;
  }

  if(card === firstMatch) {
    return;
  }


  card.classList.add("selected");


  if(!firstMatch) {

    firstMatch =
      card;


    if(
      card.dataset.type === "word"
    ) {

      speak(card.textContent);

    }

    return;

  }


  const sameWord =

    firstMatch.dataset.id ===
    card.dataset.id;


  const differentType =

    firstMatch.dataset.type !==
    card.dataset.type;


  if(
    sameWord &&
    differentType
  ) {

    const first =
      firstMatch;


    const matchedIndex =
      Number(card.dataset.id);


    setTimeout(() => {

      first.classList.add("matched");

      card.classList.add("matched");


      first.classList.remove("selected");

      card.classList.remove("selected");


      learned.add(matchedIndex);

      updateProgress();

      buildWordGrid();


      matchedPairs++;


      if(matchedPairs === 8) {

        document.getElementById("matchMessage").textContent =
          "🎉 You matched them all! Amazing! 🏆";


        setTimeout(
          startMatch,
          1800
        );

      }

    },400);


    speak(
      words[matchedIndex].word
    );


    firstMatch =
      null;

  }

  else {

    lockMatch =
      true;


    const first =
      firstMatch;


    setTimeout(() => {

      first.classList.remove("selected");

      card.classList.remove("selected");


      firstMatch =
        null;


      lockMatch =
        false;

    },700);

  }

}


/* ==================================================
   START APP
================================================== */

buildWordGrid();

showFlash();

updateProgress();

</script>
